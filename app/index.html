<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidor Apache | Ativo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 255, 0, 0.1);
            border-top: 4px solid #00ff00;
            max-width: 400px;
        }
        h1 {
            color: #00ff00;
            margin-bottom: 10px;
        }
        p {
            color: #b3b3b3;
            line-height: 1.6;
        }
        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            background-color: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Sistema Online</h1>
        <p>Esta é uma aplicação web completa rodando dentro de um container Docker com servidor Apache (httpd).</p>
        <div class="status">● Status: Operacional</div>
    </div>
</body>
</html>
